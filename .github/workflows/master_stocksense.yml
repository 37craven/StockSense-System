# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - StockSense

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # FIX: Build the solution WITHOUT the --runtime flag
      - name: Build with dotnet
        run: dotnet build --configuration Release

      # FIX: Point the publish command specifically to your main Web Project folder
      # Replace 'StockSense/StockSense.csproj' with the actual path to your server project
      - name: dotnet publish
        run: dotnet publish StockSense.Web/StockSense.Web.csproj -c Release -r win-x64 --self-contained false -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4E1854C6EFC54B8B9C5B093E83ACD75F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C511AF2E423944B2B5DD4BDD641A8B39 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_099A9D1BC8CD4C35876F3F52CAFA2A25 }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'StockSense'
          slot-name: 'Production'
          package: .